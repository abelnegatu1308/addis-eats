<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addis Eats | Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page">
  <header class="admin-header">
    <div class="container nav">
      <a class="logo" href="index.html">🍴 Addis <span>Eats</span></a>
      <div class="admin-actions">
        <span id="adminUser" class="muted">Admin</span>
        <a href="index.html" class="btn btn-secondary">Customer site</a>
        <button id="logoutBtn" class="btn btn-danger">Logout</button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-heading">
        <div>
          <p class="eyebrow">ADMIN DASHBOARD</p>
          <h1>Restaurant overview</h1>
        </div>
      </div>

      <section class="stats-grid">
        <article class="stat-card"><span>Revenue</span><strong id="statRevenue">0 ETB</strong></article>
        <article class="stat-card"><span>Total orders</span><strong id="statOrders">0</strong></article>
        <article class="stat-card"><span>Average order</span><strong id="statAverage">0 ETB</strong></article>
        <article class="stat-card"><span>Dishes</span><strong id="statDishes">0</strong></article>
      </section>

      <section class="admin-grid">
        <article class="panel">
          <div class="panel-header">
            <div><p class="eyebrow">MENU MANAGEMENT</p><h2>Dishes</h2></div>
            <button id="addDishBtn" class="btn btn-primary">+ Add dish</button>
          </div>
          <input id="dishSearch" class="admin-search" type="search" placeholder="Search dishes...">
          <div id="dishTableWrap" class="table-wrap"></div>
        </article>

        <article class="panel">
          <div class="panel-header">
            <div><p class="eyebrow">ORDER MANAGEMENT</p><h2>Orders</h2></div>
          </div>
          <div id="orderTableWrap" class="table-wrap"></div>
        </article>
      </section>

      <section class="admin-grid">
        <article class="panel">
          <div class="panel-header"><div><p class="eyebrow">TOP SELLERS</p><h2>Best-selling dishes</h2></div></div>
          <div id="topSellers"></div>
        </article>
        <article class="panel">
          <div class="panel-header"><div><p class="eyebrow">ORDER STATUS</p><h2>Status distribution</h2></div></div>
          <div id="statusDistribution"></div>
        </article>
      </section>
    </div>
  </main>

  <div id="dishModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button id="closeDishModal" class="close-btn modal-close">×</button>
      <p class="eyebrow">MENU ITEM</p>
      <h2 id="dishModalTitle">Add dish</h2>
      <form id="dishForm">
        <input id="dishId" type="hidden">
        <label>Name<input id="dishName" required></label>
        <label>Description<textarea id="dishDescription" rows="3" required></textarea></label>
        <div class="form-row">
          <label>Price (ETB)<input id="dishPrice" type="number" min="1" required></label>
          <label>Category
            <select id="dishCategory" required>
              <option value="ethiopian">Ethiopian</option>
              <option value="pizza">Pizza</option>
              <option value="burgers">Burgers</option>
              <option value="drinks">Drinks</option>
            </select>
          </label>
        </div>
        <label>Image URL <span class="muted">(optional)</span><input id="dishImage" placeholder="https://..."></label>
        <label>Ingredients <span class="muted">(comma separated)</span><input id="dishIngredients" required></label>
        <button class="btn btn-primary btn-full" type="submit">Save dish</button>
      </form>
    </div>
  </div>

  <div id="orderModal" class="modal hidden">
    <div class="modal-card">
      <button id="closeOrderModal" class="close-btn modal-close">×</button>
      <div id="orderDetails"></div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
